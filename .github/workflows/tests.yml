name: tests

on:
  push:
    branches: [master, main, embedding-db]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite never downloads a checkpoint. NumPy carries the storage,
      # packing, capacity and metric code; OpenCV is only needed by the frame
      # preprocessing test, and torch/transformers are not needed at all.
      - name: Install
        run: python -m pip install --upgrade pip "numpy>=1.24" "opencv-python-headless>=4.8"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the no-model pipeline
        run: |
          python -m embedding_db estimate --budget 2GiB
          python -m embedding_db import-vectors \
            --vectors sample_database/embeddings.npy \
            --split-csv sample_database/MSRVTT_JSFUSION_test.csv \
            --output-dir msrvtt_1k_db
          python -m embedding_db pack --db msrvtt_1k_db --output-dir packed_int8 --packing int8
          python -m embedding_db compare --db msrvtt_1k_db
